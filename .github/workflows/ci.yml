name: CI - Pipeline Profesional

on:
  push:
    branches:
      - master
      - developers
  pull_request:
    branches:
      - master
      - developers
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-build:
    name: CI Base (Tests + Cobertura + Linting)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            working-dir: apps/backend
            setup-java: true
            setup-node: false
          - service: frontend
            working-dir: apps/frontend
            setup-java: false
            setup-node: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend: Setup Java
      - name: Set up JDK 17 (Backend)
        if: matrix.setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Frontend: Setup Node.js
      - name: Set up Node.js (Frontend)
        if: matrix.setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # Backend: Linting (Checkstyle via Maven)
      - name: Backend Linting (Checkstyle)
        if: matrix.setup-java
        working-directory: apps/backend
        run: mvn -B -ntp clean verify -DskipTests=true -Pcheckstyle

      # Backend: Tests with Coverage
      - name: Backend Unit Tests with JaCoCo Coverage
        if: matrix.setup-java
        working-directory: apps/backend
        run: mvn -B -ntp -Dtest='*Test,!*IntegrationTest,!*ContractTest' clean test verify

      # Frontend: Install dependencies
      - name: Frontend Install Dependencies
        if: matrix.setup-node
        working-directory: apps/frontend
        run: npm ci

      # Frontend: Linting
      - name: Frontend Linting (ESLint)
        if: matrix.setup-node
        working-directory: apps/frontend
        run: npm run lint -- --format json > lint-report.json || true
        continue-on-error: true

      # Frontend: Tests with Coverage
      - name: Frontend Unit Tests with Coverage
        if: matrix.setup-node
        working-directory: apps/frontend
        run: npm run test:ci

      # Upload Coverage Reports
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: |
            ${{ matrix.working-dir }}/target/site/jacoco/
            ${{ matrix.working-dir }}/coverage/
          if-no-files-found: ignore

  cypress-e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Start frontend (background)
        run: npm start -- --host 0.0.0.0 --port 4200 &
        working-directory: apps/frontend

      - name: Wait for frontend
        run: npx wait-on http://localhost:4200 --timeout 120000

      - name: Run Cypress
        run: npx cypress run --headed --browser chrome --config-file cypress.config.js
        working-directory: apps/frontend

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            apps/frontend/cypress/screenshots
            apps/frontend/cypress/videos
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: ci-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history para análisis completo

      - name: Set up JDK 17 (for SonarCloud Scanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js (for frontend coverage)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Download Backend Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: apps/backend/target/site/jacoco/

      - name: Download Frontend Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/

      - name: Install Frontend Dependencies (for lint report)
        run: npm ci
        working-directory: apps/frontend

      - name: Generate Frontend Lint Report
        run: npm run lint -- --format json > lint-report.json || true
        working-directory: apps/frontend
        continue-on-error: true

      - name: Build Backend (generate coverage for Sonar)
        run: mvn -B -ntp -Dtest='*Test,!*IntegrationTest,!*ContractTest' clean test verify
        working-directory: apps/backend

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=JosueS02_DSW01-Practica02
            -Dsonar.organization=josues02
            -Dsonar.sources=apps/backend/src/main,apps/frontend/src
            -Dsonar.tests=apps/backend/src/test,apps/frontend/src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.cpd.exclusions=**/*.spec.ts
            -Dsonar.java.binaries=apps/backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=apps/backend/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
            -Dsonar.eslint.reportPaths=apps/frontend/lint-report.json
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/target/**
            

  docker-hub:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [sonarcloud, cypress-e2e]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/empleados-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/empleados-frontend:latest
