# Configuración de SonarCloud

# Identificador del proyecto en SonarCloud
sonar.projectKey=JosueS02_DSW01-Practica02
sonar.organization=josues02

# Información del proyecto
sonar.projectName=DSW01-Practica02
sonar.projectVersion=0.0.1

# Fuentes
sonar.sources=apps/backend/src/main,apps/frontend/src
sonar.tests=apps/backend/src/test,apps/frontend/src

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**
sonar.test.exclusions=**/node_modules/**

# Coverage (Backend - JaCoCo)
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=apps/backend/target/site/jacoco/jacoco.xml

# Coverage (Frontend - LCOV)
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info

# ESLint (Frontend)
sonar.eslint.reportPaths=apps/frontend/lint-report.json

# Lenguajes
sonar.sources.inclusions=**/*.java,**/*.ts,**/*.js,**/*.html

# Calidad
sonar.qualitygate.wait=true
